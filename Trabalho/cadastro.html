<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Primeiro Passo</title>
</head>
<link rel="stylesheet" href="Css/cadastro.css">

<body>  

    <h1>Cadastro</h1>

    <form>

        <label>Nome:</label>
        <input type="text" name="nome">

        <br><br>

        <label>E-mail:</label>
        <input type="email" name="email">

        <br><br>

        <label>Senha:</label>
        <input type="password" name="senha">

        <br><br>

        <label>Idade:</label>
        <input type="number" name="idade">

        <br><br>

        <label>Telefone:</label>
        <input type="tel" name="telefone">

        <br><br>

        <a href="index.html" class="botao-cadastrar">Cadastrar</a>

    </form>


</body>
</html>
