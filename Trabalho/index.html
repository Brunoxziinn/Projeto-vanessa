<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Inicial</title>
    <link rel="stylesheet" href="./Css/index.css">
    <!--Fonte exportada-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

</head>
<body class="meu_body">

    <!--Cabeçalho da pagina-->
    <header class="meu_header">
        <div class="header_design">
            <img src="./Imagens/logo.ico" style="height: 71px; margin-left: 90px; margin-top: 8px;">
            <h1 style="color: rgb(7, 7, 68); margin-left: 10px;">Primeiros</h1>
            <h1 style="margin-left: 10px;">Passos</h1>
            <!--barra de pesquisa-->
            <div class="container_barra">
                <img src="./Imagens/Lupa.png" alt="logo_lupa" style="height: 25px; margin-left: 15px; margin-top: 13px;">
                <div class="h6_barra">
                    <p>Buscar por cursos, empresas...</p>
                </div>
            </div>
            <img src="./Imagens/email.png" alt="logo_email" style="height: 45px; margin-left: 55px; margin-top: 20px;">
            <img src="./Imagens/Sino.png" alt="logo_sino" style="height: 65px; margin-left: 20px; margin-top: 8px;">
            <img src="./Imagens/Perfil.png" alt="Logo_perfil" style="height: 43px; border-radius: 80px; margin-top: 20px; margin-left: 15px;">
            <img src="./Imagens/Seta_baixo.png" alt="Logo_seta" style="height: 25px; margin-top: 29px; margin-left: 5px;">
        </div>
    </header>

    <!--Corpo da pagina-->
    <div class="corpo_container">
        <div class="container_menu">
            <div class="home">
                <img src="./Imagens/home.png" alt="icone_home" style="height: 50px;">
                <h3>Inicio</h3>
            </div>

            <div class="Vagas">
                <img src="./Imagens/mala.png" alt="icone_vagas" style="height: 50px;">
                <h3>Vagas</h3>
            </div>
        </div>
    </div>

    
</body>
</html>
